<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memelabs — Login</title>
  <link rel="shortcut icon" href="./assets/images/Favicon 1.png" type="image/x-icon">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold:      #f5a623;
      --gold-dark: #d4891a;
      --gold-dim:  rgba(245,166,35,0.12);
      --gold-bdr:  rgba(245,166,35,0.2);
      --bg:        #08060a;
      --surface:   rgba(18,14,4,0.92);
      --text:      #fff;
      --muted:     rgba(255,255,255,0.4);
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Background orbs */
    .bg-orb {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
    }
    .bg-orb-1 {
      width: 600px; height: 600px;
      top: -200px; right: -100px;
      background: radial-gradient(circle, rgba(245,166,35,0.12) 0%, transparent 65%);
      animation: drift 12s ease-in-out infinite;
    }
    .bg-orb-2 {
      width: 400px; height: 400px;
      bottom: -150px; left: -80px;
      background: radial-gradient(circle, rgba(245,166,35,0.07) 0%, transparent 65%);
      animation: drift 15s ease-in-out infinite reverse;
    }
    .bg-grid {
      position: fixed; inset: 0; z-index: 0;
      background-image:
        linear-gradient(rgba(245,166,35,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(245,166,35,0.03) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
    }
    @keyframes drift {
      0%,100% { transform: translateY(0) scale(1); }
      50%      { transform: translateY(-30px) scale(1.05); }
    }

    /* Card */
    .auth-card {
      position: relative; z-index: 1;
      width: 100%; max-width: 420px;
      margin: 20px;
      background: var(--surface);
      border: 1px solid var(--gold-bdr);
      border-radius: 24px;
      padding: 40px 36px;
      backdrop-filter: blur(20px);
      animation: slideUp 0.4s ease;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Logo */
    .auth-logo {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 32px; text-decoration: none;
    }
    .auth-logo img   { width: 36px; height: 36px; border-radius: 8px; object-fit: cover; }
    .auth-logo span  { font-size: 20px; font-weight: 800; color: var(--text); letter-spacing: -0.02em; }

    .auth-title {
      font-size: 26px; font-weight: 800; color: var(--text);
      letter-spacing: -0.02em; margin-bottom: 6px;
    }
    .auth-sub {
      font-size: 14px; color: var(--muted); margin-bottom: 28px; line-height: 1.5;
    }

    /* Form */
    .form-group { margin-bottom: 16px; }

    label {
      display: block; font-size: 12px; font-weight: 600;
      color: var(--muted); letter-spacing: 0.06em;
      text-transform: uppercase; margin-bottom: 8px;
    }

    .input-wrap { position: relative; }

    .input-wrap svg {
      position: absolute; left: 14px; top: 50%;
      transform: translateY(-50%);
      color: rgba(255,255,255,0.25); pointer-events: none;
    }

    input[type="email"],
    input[type="password"],
    input[type="text"] {
      width: 100%;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 13px 14px 13px 42px;
      font-size: 14px; color: var(--text);
      font-family: 'DM Sans', sans-serif;
      outline: none;
      transition: border-color 0.2s, background 0.2s;
    }
    input::placeholder { color: rgba(255,255,255,0.2); }
    input:focus {
      border-color: rgba(245,166,35,0.5);
      background: rgba(245,166,35,0.04);
    }

    .input-toggle {
      position: absolute; right: 14px; top: 50%;
      transform: translateY(-50%);
      background: none; border: none; cursor: pointer;
      color: rgba(255,255,255,0.3); padding: 0;
      transition: color 0.15s;
    }
    .input-toggle:hover { color: var(--gold); }

    /* Remember + forgot */
    .auth-row {
      display: flex; align-items: center;
      justify-content: space-between; margin-bottom: 24px;
    }

    .checkbox-wrap {
      display: flex; align-items: center; gap: 8px; cursor: pointer;
    }
    .checkbox-wrap input[type="checkbox"] { display: none; }
    .custom-check {
      width: 18px; height: 18px; border-radius: 5px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.04);
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s; flex-shrink: 0;
    }
    .checkbox-wrap input:checked + .custom-check {
      background: var(--gold); border-color: var(--gold);
    }
    .checkbox-wrap input:checked + .custom-check::after {
      content: '✓'; font-size: 11px; color: #000; font-weight: 700;
    }
    .checkbox-label { font-size: 13px; color: var(--muted); }

    .forgot-link {
      font-size: 13px; color: var(--gold);
      text-decoration: none; font-weight: 500;
      transition: opacity 0.15s;
    }
    .forgot-link:hover { opacity: 0.75; }

    /* Submit */
    .btn-submit {
      width: 100%; padding: 14px;
      background: linear-gradient(135deg, var(--gold), var(--gold-dark));
      border: none; border-radius: 999px;
      font-size: 15px; font-weight: 700;
      font-family: 'DM Sans', sans-serif;
      color: #000; cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 20px rgba(245,166,35,0.25);
      margin-bottom: 20px;
    }
    .btn-submit:hover  { transform: translateY(-1px); box-shadow: 0 6px 24px rgba(245,166,35,0.35); }
    .btn-submit:active { transform: scale(0.98); }

    /* Divider */
    .auth-divider {
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 20px;
    }
    .auth-divider::before,
    .auth-divider::after {
      content: ''; flex: 1;
      height: 1px; background: rgba(255,255,255,0.08);
    }
    .auth-divider span { font-size: 12px; color: var(--muted); white-space: nowrap; }

    /* Wallet button */
    .btn-wallet {
      width: 100%; padding: 13px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 999px;
      font-size: 14px; font-weight: 600;
      font-family: 'DM Sans', sans-serif;
      color: var(--text); cursor: pointer;
      transition: all 0.2s;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      margin-bottom: 28px;
    }
    .btn-wallet:hover { border-color: var(--gold-bdr); background: var(--gold-dim); }

    .wallet-icon {
      width: 22px; height: 22px;
      background: linear-gradient(135deg, var(--gold), var(--gold-dark));
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px;
    }

    /* Switch link */
    .auth-switch {
      text-align: center; font-size: 14px; color: var(--muted);
    }
    .auth-switch a {
      color: var(--gold); font-weight: 600;
      text-decoration: none; transition: opacity 0.15s;
    }
    .auth-switch a:hover { opacity: 0.75; }

    /* Error message */
    .auth-error {
      background: rgba(248,113,113,0.1);
      border: 1px solid rgba(248,113,113,0.2);
      border-radius: 10px; padding: 12px 14px;
      font-size: 13px; color: #f87171;
      margin-bottom: 16px; display: none;
    }

    @media (max-width: 480px) {
      .auth-card { padding: 28px 20px; }
      .auth-title { font-size: 22px; }
    }
  </style>
</head>
<body>

  <div class="bg-grid"></div>
  <div class="bg-orb bg-orb-1"></div>
  <div class="bg-orb bg-orb-2"></div>

  <div class="auth-card">

    <a href="./index.html" class="auth-logo">
      <img src="./assets/images/Memelabs Logo 1.png" alt="Logo">
      <span>Memelabs</span>
    </a>

    <div class="auth-title">Welcome back</div>
    <div class="auth-sub">Sign in to your account to trade meme coins and track your portfolio.</div>

    <div class="auth-error" id="loginError">Invalid email or password. Please try again.</div>

    <form onsubmit="handleLogin(event)">

      <div class="form-group">
        <label>Email address</label>
        <div class="input-wrap">
          <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
            <polyline points="22,6 12,13 2,6"/>
          </svg>
          <input type="email" placeholder="you@example.com" id="loginEmail" required>
        </div>
      </div>

      <div class="form-group">
        <label>Password</label>
        <div class="input-wrap">
          <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <input type="password" placeholder="••••••••" id="loginPassword" required>
          <button type="button" class="input-toggle" onclick="togglePassword('loginPassword',this)">
            <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="auth-row">
        <label class="checkbox-wrap">
          <input type="checkbox" id="remember">
          <div class="custom-check"></div>
          <span class="checkbox-label">Remember me</span>
        </label>
        <a href="#" class="forgot-link">Forgot password?</a>
      </div>

      <button type="submit" class="btn-submit">Sign in</button>
    </form>

    <div class="auth-divider"><span>or continue with</span></div>

    <button class="btn-wallet" onclick="connectWallet()">
      <div class="wallet-icon">⬡</div>
      Connect Wallet
    </button>

    <div class="auth-switch">
      Don't have an account? <a href="./signup.html">Create one</a>
    </div>

  </div>

  <script>
    function togglePassword(id, btn) {
      const input = document.getElementById(id);
      const isText = input.type === "text";
      input.type = isText ? "password" : "text";
      btn.style.color = isText ? "rgba(255,255,255,0.3)" : "var(--gold)";
    }

    function handleLogin(e) {
      e.preventDefault();
      const btn = e.target.querySelector(".btn-submit");
      btn.textContent = "Signing in...";
      btn.style.opacity = "0.7";

      setTimeout(() => {
        // Demo: any login goes to dashboard
        window.location.href = "./dashboard.html";
      }, 1200);
    }

    function connectWallet() {
      const btn = document.querySelector(".btn-wallet");
      btn.textContent = "Connecting...";
      setTimeout(() => {
        window.location.href = "./dashboard.html";
      }, 1000);
    }
  </script>
</body>
</html>
