<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memelabs — Login</title>
  <link rel="shortcut icon" href="./assets/images/Favicon 1.png" type="image/x-icon">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    :root{--gold:#f5a623;--gold-dark:#d4891a;--gold-dim:rgba(245,166,35,0.1);--gold-bdr:rgba(245,166,35,0.2);--bg:#08060a;--surface:rgba(18,14,4,0.95);--text:#fff;--muted:rgba(255,255,255,0.4);}
    body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;}
    .bg-orb{position:fixed;border-radius:50%;pointer-events:none;z-index:0;}
    .bg-orb-1{width:600px;height:600px;top:-200px;right:-100px;background:radial-gradient(circle,rgba(245,166,35,0.12) 0%,transparent 65%);animation:drift 12s ease-in-out infinite;}
    .bg-orb-2{width:400px;height:400px;bottom:-150px;left:-80px;background:radial-gradient(circle,rgba(245,166,35,0.07) 0%,transparent 65%);animation:drift 15s ease-in-out infinite reverse;}
    .bg-grid{position:fixed;inset:0;z-index:0;background-image:linear-gradient(rgba(245,166,35,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(245,166,35,0.03) 1px,transparent 1px);background-size:48px 48px;pointer-events:none;}
    @keyframes drift{0%,100%{transform:translateY(0) scale(1);}50%{transform:translateY(-30px) scale(1.05);}}
    .card{position:relative;z-index:1;width:100%;max-width:420px;margin:20px;background:var(--surface);border:1px solid var(--gold-bdr);border-radius:24px;padding:40px 36px;backdrop-filter:blur(20px);animation:up .4s ease;}
    @keyframes up{from{opacity:0;transform:translateY(24px);}to{opacity:1;transform:translateY(0);}}
    .logo{display:flex;align-items:center;gap:10px;margin-bottom:32px;text-decoration:none;}
    .logo img{width:36px;height:36px;border-radius:8px;object-fit:cover;}
    .logo span{font-size:20px;font-weight:800;color:var(--text);letter-spacing:-0.02em;}
    h1{font-size:26px;font-weight:800;letter-spacing:-0.02em;margin-bottom:6px;}
    .sub{font-size:14px;color:var(--muted);margin-bottom:28px;line-height:1.5;}
    .fg{margin-bottom:16px;}
    label.lbl{display:block;font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px;}
    .iw{position:relative;}
    .iw svg.icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:rgba(255,255,255,0.25);pointer-events:none;width:16px;height:16px;}
    input[type=email],input[type=password],input[type=text]{width:100%;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:13px 44px 13px 42px;font-size:14px;color:var(--text);font-family:'DM Sans',sans-serif;outline:none;transition:border-color .2s,background .2s;}
    input::placeholder{color:rgba(255,255,255,0.2);}
    input:focus{border-color:rgba(245,166,35,.5);background:rgba(245,166,35,.04);}
    .eye-btn{position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;padding:4px;transition:color .15s;}
    .eye-btn:hover{color:var(--gold);}
    .eye-btn svg{width:16px;height:16px;pointer-events:none;}
    .row{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;}
    .cb{display:flex;align-items:center;gap:8px;cursor:pointer;}
    .cb input[type=checkbox]{display:none;}
    .box{width:18px;height:18px;border-radius:5px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.04);display:flex;align-items:center;justify-content:center;transition:all .2s;}
    .cb input:checked+.box{background:var(--gold);border-color:var(--gold);}
    .cb input:checked+.box::after{content:'✓';font-size:11px;color:#000;font-weight:700;}
    .cb-lbl{font-size:13px;color:var(--muted);}
    .fgt{font-size:13px;color:var(--gold);text-decoration:none;font-weight:500;}
    .fgt:hover{opacity:.75;}
    .btn-primary{width:100%;padding:14px;background:linear-gradient(135deg,var(--gold),var(--gold-dark));border:none;border-radius:999px;font-size:15px;font-weight:700;font-family:'DM Sans',sans-serif;color:#000;cursor:pointer;transition:all .2s;box-shadow:0 4px 20px rgba(245,166,35,.25);margin-bottom:20px;}
    .btn-primary:hover{transform:translateY(-1px);box-shadow:0 6px 24px rgba(245,166,35,.35);}
    .btn-primary:active{transform:scale(.98);}
    .divider{display:flex;align-items:center;gap:12px;margin-bottom:20px;}
    .divider::before,.divider::after{content:'';flex:1;height:1px;background:rgba(255,255,255,.08);}
    .divider span{font-size:12px;color:var(--muted);}
    .btn-wallet{width:100%;padding:13px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:999px;font-size:14px;font-weight:600;font-family:'DM Sans',sans-serif;color:var(--text);cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:28px;}
    .btn-wallet:hover{border-color:var(--gold-bdr);background:var(--gold-dim);}
    .wi{width:22px;height:22px;background:linear-gradient(135deg,var(--gold),var(--gold-dark));border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px;}
    .sw{text-align:center;font-size:14px;color:var(--muted);}
    .sw a{color:var(--gold);font-weight:600;text-decoration:none;}
    .sw a:hover{opacity:.75;}
    @media(max-width:480px){.card{padding:28px 20px;}h1{font-size:22px;}}
  </style>
</head>
<body>
<div class="bg-grid"></div>
<div class="bg-orb bg-orb-1"></div>
<div class="bg-orb bg-orb-2"></div>
 
<div class="card">
  <a href="./index.html" class="logo">
    <img src="./assets/images/Memelabs Logo 1.png" alt="Logo" onerror="this.style.display='none'">
    <span>Memelabs</span>
  </a>
  <h1>Welcome back</h1>
  <p class="sub">Sign in to your account to trade meme coins and track your portfolio.</p>
 
  <form id="loginForm">
    <div class="fg">
      <label class="lbl">Email address</label>
      <div class="iw">
        <svg class="icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
        <input type="email" id="loginEmail" placeholder="you@example.com" required>
      </div>
    </div>
    <div class="fg">
      <label class="lbl">Password</label>
      <div class="iw">
        <svg class="icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <input type="password" id="loginPassword" placeholder="••••••••" required>
        <button type="button" class="eye-btn" id="toggleLogin">
          <svg id="eyeShowLogin" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg id="eyeHideLogin" style="display:none" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
        </button>
      </div>
    </div>
    <div class="row">
      <label class="cb"><input type="checkbox" id="remember"><div class="box"></div><span class="cb-lbl">Remember me</span></label>
      <a href="#" class="fgt">Forgot password?</a>
    </div>
    <button type="submit" class="btn-primary" id="loginBtn">Sign in</button>
  </form>
 
  <div class="divider"><span>or continue with</span></div>
  <button class="btn-wallet" onclick="goToDashboard()"><div class="wi">⬡</div>Connect Wallet</button>
  <div class="sw">Don't have an account? <a href="./signup.html">Create one</a></div>
</div>
 
<script>
  // Password toggle — fixed
  document.getElementById('toggleLogin').addEventListener('click', function() {
    const input = document.getElementById('loginPassword');
    const show  = document.getElementById('eyeShowLogin');
    const hide  = document.getElementById('eyeHideLogin');
    if (input.type === 'password') {
      input.type = 'text';
      show.style.display = 'none';
      hide.style.display = 'block';
      this.style.color = 'var(--gold)';
    } else {
      input.type = 'password';
      show.style.display = 'block';
      hide.style.display = 'none';
      this.style.color = 'rgba(255,255,255,0.3)';
    }
  });
 
  document.getElementById('loginForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const btn = document.getElementById('loginBtn');
    btn.textContent = 'Signing in...';
    btn.style.opacity = '0.7';
    setTimeout(() => { window.location.href = './dashboard.html'; }, 1200);
  });
 
  function goToDashboard() {
    window.location.href = './dashboard.html';
  }
</script>
</body>
</html>
